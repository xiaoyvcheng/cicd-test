# GitLab CI for cicd-demo — see docs/implement-gitlab-ci.md
# Do not enable Jenkins auto-deploy to the same prod host at the same time.

stages:
  - build
  - deploy_dev
  - deploy_test
  - deploy_prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  APP_DIR: app
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

.default_rules_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build_jar:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "$APP_DIR"
    - mvn -B clean verify
  artifacts:
    paths:
      - app/target/*.jar
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: build_jar
      optional: true
  script:
    - cd "$APP_DIR"
    - mvn -B -DskipTests package
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

deploy_dev:
  stage: deploy_dev
  image: alpine:3.20
  needs: ["build_image"]
  environment:
    name: dev
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$APP_DEV_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "deploy@$APP_DEV_HOST" "
        cd /opt/cicd-demo-dev &&
        export REGISTRY_IMAGE=$CI_REGISTRY_IMAGE IMAGE_TAG=$IMAGE_TAG &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker compose pull &&
        docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_test:
  stage: deploy_test
  image: alpine:3.20
  needs: ["deploy_dev"]
  environment:
    name: test
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$APP_DEV_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "deploy@$APP_DEV_HOST" "
        cd /opt/cicd-demo-test &&
        export REGISTRY_IMAGE=$CI_REGISTRY_IMAGE IMAGE_TAG=$IMAGE_TAG &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker compose pull &&
        docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_prod:
  stage: deploy_prod
  image: alpine:3.20
  needs: ["build_image"]
  environment:
    name: production
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$APP_PROD_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "deploy@$APP_PROD_HOST" "
        cd /opt/cicd-demo-prod &&
        export REGISTRY_IMAGE=$CI_REGISTRY_IMAGE IMAGE_TAG=$IMAGE_TAG &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker compose pull &&
        docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
