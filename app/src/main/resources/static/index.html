<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --dev: #22c55e;
      --test: #3b82f6;
      --prod: #ef4444;
      --local: #a855f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .badge.dev { background: rgba(34,197,94,.2); color: var(--dev); }
    .badge.test { background: rgba(59,130,246,.2); color: var(--test); }
    .badge.prod { background: rgba(239,68,68,.2); color: var(--prod); }
    .badge.local { background: rgba(168,85,247,.2); color: var(--local); }
    .greeting { font-size: 1.15rem; margin: 0 0 20px; }
    dl { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 10px 16px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
    .links { margin-top: 24px; font-size: .9rem; }
    .links a { color: #60a5fa; margin-right: 12px; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">CI/CD Demo</h1>
    <span id="badge" class="badge local">loading</span>
    <p id="greeting" class="greeting">Loading...</p>
    <dl id="meta"></dl>
    <div class="links">
      <a href="/api/info">/api/info</a>
      <a href="/api/hello">/api/hello</a>
      <a href="/actuator/health">/actuator/health</a>
    </div>
  </div>
  <script>
    const badge = document.getElementById('badge');
    const greeting = document.getElementById('greeting');
    const meta = document.getElementById('meta');

    function envClass(env) {
      const e = (env || 'local').toLowerCase();
      return ['dev', 'test', 'prod'].includes(e) ? e : 'local';
    }

    Promise.all([
      fetch('/api/info').then(r => r.json()),
      fetch('/api/hello').then(r => r.json())
    ]).then(([info, hello]) => {
      badge.textContent = info.env || 'local';
      badge.className = 'badge ' + envClass(info.env);
      greeting.textContent = hello.message || 'Hello';
      document.getElementById('title').textContent = info.appName || 'CI/CD Demo';

      const rows = [
        ['Profile', info.profile],
        ['Version', info.version],
        ['Git commit', info.gitCommit],
        ['Git branch', info.gitBranch],
        ['Build time', info.buildTime]
      ];
      meta.innerHTML = rows.map(([k, v]) =>
        `<dt>${k}</dt><dd>${v ?? '-'}</dd>`
      ).join('');
    }).catch(err => {
      greeting.innerHTML = '<span class="error">Failed to load: ' + err.message + '</span>';
    });
  </script>
</body>
</html>
